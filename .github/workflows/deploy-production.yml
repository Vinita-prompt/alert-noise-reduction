name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a private GitHub repository
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "Production images may only be published from a private repository."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Test backend
        working-directory: backend
        run: npm ci --ignore-scripts && npm test
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm ci --ignore-scripts && npm run build
      - name: Derive immutable image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend_image=ghcr.io/${repository}/backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${repository}/frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.images.outputs.backend_image }}
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_BASE_URL=/api
          tags: ${{ steps.images.outputs.frontend_image }}

  deploy:
    needs: build-test-publish
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKEND_IMAGE: ${{ needs.build-test-publish.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build-test-publish.outputs.frontend_image }}
      RELEASE_SHA: ${{ github.sha }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.PRODUCTION_GHCR_TOKEN }}
    steps:
      - name: Deploy approved release to always-on host
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,RELEASE_SHA,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -eu
            cd "${{ vars.PRODUCTION_DEPLOY_PATH }}"
            git fetch origin "$RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
            BACKEND_ENV_FILE=./backend/.env.production BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" docker compose --env-file backend/.env.production -f compose.production.yml pull
            BACKEND_ENV_FILE=./backend/.env.production BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" docker compose --env-file backend/.env.production -f compose.production.yml run --rm --no-deps backend npm run deploy:validate-config -- --environment
            BACKEND_ENV_FILE=./backend/.env.production BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" docker compose --env-file backend/.env.production -f compose.production.yml up -d --no-build --wait --wait-timeout 180
            docker logout ghcr.io
      - name: Verify permanent production readiness
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors --output /dev/null "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/live"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors --output /dev/null "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/ready"
